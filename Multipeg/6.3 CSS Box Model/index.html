<!DOCTYPE html>

<head>

  <title>CSS Box Model</title>
  <style>
    /* Write your CSS code here */
div {height: 200px;
   width: 200px;}

   #first { background-color: cadetblue;}
   #second {background-color: gold}
   #third {background-color: indianred}

   #first { 
    padding-top: 20px;
    padding-right: 20px;
    padding-bottom: 20px;
    padding-left: 20px;
    border: 10px solid black;
    border-radius: 0px;
    }
    
           
p {margin: 0;}

#second {
  border-top-width: 20px;
  border-bottom-width: 20px;
  border-right-width: 10px;
  border-left-width: 10px;
  border-style: solid;
  margin-left: 260px;
 
}
#third {
  border: 10px solid black;
  margin-left: 40px;
}

  </style>
</head>
