ÚKOL: Vytvoř webovou stránku s motivačním příspěvkem.

Styl si zvol podle sebe, pro inspiraci se podívej na vzorový obrázek. Stránka však musí obsahovat následující prvky:

Tip: Div horizontálně vycentruješ tak, že mu nastavíš šířku (width) na 50 % a levý okraj (margin-left) na 25 %.

Tip: Obrázku nastav šířku na 100 %, aby vyplnil celý div.

Velká písmena: Nastuduj si vlastnost text-transform v dokumentaci MDN a pomocí CSS nastav nadpis h1 tak, aby byl celý velkými písmeny (uppercase): https://developer.mozilla.org/en-US/docs/Web/CSS/text-transform.
