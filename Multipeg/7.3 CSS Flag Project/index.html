<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      /* Write your CSS Code here */
      .flag {
        background-color: #ce1126;
        width: 900px;
        height: 600px;
        position: static;
        margin-top: 8px;
        margin-right: 8px;
        margin-bottom: 20px;
        margin-left: 8px;
      }
      .flag > p {
        color: white;
        font-size: 4rem;
        text-align: center;
        padding-top: 0px;
        padding-bottom: 50px;
        margin: 0;
      }
      div > div {
        box-sizing: content-box;
        background-color: #002868;
        position: static;
        height: 400px;
        width: 900px;
        top: 120px;
        bottom: 120px;
      }

      div > div p {
        background-color: white;
        position: absolute;
        height: 200px;
        width: 200px;
        border-radius: 50%;
        top: 130px;  
        left: 350px;
        color: rgb(14, 1, 1);
        font-size: 5rem;
        text-align: center;
      }
    </style>
  </head>

  <!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
